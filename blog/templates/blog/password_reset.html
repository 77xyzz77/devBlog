{% extends "blog/base.html" %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">

        <div class="auth-card__logo">
            <div class="auth-card__logo-icon">&#128274;</div>
        </div>

        <h1 class="auth-card__title">Reset hasła</h1>
        <p class="auth-card__subtitle">
            Podaj swój adres email — wyślemy Ci link do resetowania hasła.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="id_email">Adres email</label>
                <input
                    type="email"
                    name="email"
                    id="id_email"
                    class="form-control"
                    placeholder="twoj@email.pl"
                    required
                    autofocus
                >
            </div>
            <button type="submit" class="btn btn--primary btn--block btn--lg">
                Wyślij link resetujący
            </button>
        </form>

        <div style="text-align:center; margin-top:16px; font-size:13px;">
            <a href="{% url 'blog:login' %}">&#8592; Wróć do logowania</a>
        </div>

    </div>
</div>
{% endblock %}
