{% extends "blog/base.html" %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">

        <div class="auth-card__logo">
            <div class="auth-card__logo-icon">D</div>
        </div>

        <h1 class="auth-card__title">Zaloguj się</h1>
        <p class="auth-card__subtitle">Witaj z powrotem!</p>

        <form method="post">
            {% csrf_token %}
            <!-- {% csrf_token %} generuje ukryte pole z tokenem CSRF -->
            <!-- W PHP musiałeś to robić ręcznie: $_SESSION["csrf_token"] -->
            <!-- Django robi to automatycznie i sprawdza przy każdym POST -->

            {% if form.errors %}
            <div class="alert alert--error">
                Nieprawidłowa nazwa użytkownika lub hasło.
            </div>
            {% endif %}

            <div class="form-group">
                <label class="form-label" for="id_username">Nazwa użytkownika</label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    class="form-control"
                    placeholder="Twoja nazwa użytkownika"
                    autofocus
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="id_password">Hasło</label>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    class="form-control"
                    placeholder="Twoje hasło"
                    required
                >
            </div>

            <button type="submit" class="btn btn--primary btn--block btn--lg" style="margin-bottom:16px;">
                Zaloguj się
            </button>

        </form>

        <div class="auth-divider"><span>lub</span></div>

        <div style="text-align:center; margin-top:16px; font-size:13px;">
            <a href="{% url 'blog:password_reset' %}">Zapomniałeś hasła?</a>
        </div>

        <div style="text-align:center; margin-top:12px; font-size:13px; color: var(--color-text-meta);">
            Nie masz konta?
            <a href="{% url 'blog:register' %}"><strong>Zarejestruj się</strong></a>
        </div>

    </div>
</div>
{% endblock %}
