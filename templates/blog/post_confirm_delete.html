{% extends "blog/base.html" %}

{% block content %}
<div class="layout layout--narrow" style="padding-top:40px;">
    <div class="post-detail">
        <div class="post-detail__header">
            <h1 class="post-detail__title" style="font-size:22px; color: var(--color-error);">
                &#9888; Usuń wpis
            </h1>
        </div>
        <div class="post-detail__body" style="padding:24px;">
            <p style="font-size:16px; margin-bottom:8px;">
                Czy na pewno chcesz usunąć wpis:
            </p>
            <p style="font-size:18px; font-weight:700; margin-bottom:24px;">
                „{{ post.title }}"
            </p>
            <div class="alert alert--error" style="margin-bottom:24px;">
                Ta operacja jest nieodwracalna. Wpis, jego komentarze i polubienia zostaną trwale usunięte.
            </div>
            <form method="post">
                {% csrf_token %}
                <div style="display:flex; gap:12px;">
                    <button type="submit" class="btn btn--danger btn--lg">
                        &#128465; Tak, usuń wpis
                    </button>
                    <a href="{{ post.get_absolute_url }}" class="btn btn--outline btn--lg">
                        Anuluj
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
